[package]
name = "local-bot"
version = "0.1.0"
edition = "2021"
description = "本机 Bot"
publish = false

[lib]
name = "local_bot"
path = "src/lib.rs"

[[bin]]
name = "LocalBot"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
winreg = "0.52"
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }

[dev-dependencies]
ttf-parser = "0.25"

[profile.release]
strip = true
